<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Logistics Booking | TradeHub
    </title>

    <link rel="stylesheet"
          href="../css/style.css">

    <style>

        .logistics-detail-page {

            max-width: 1100px;

            margin: 0 auto;

            padding: 70px 24px 100px;

        }


        .booking-header {

            margin-bottom: 35px;

        }


        .booking-header h1 {

            margin: 12px 0;

        }


        .booking-id {

            color: #888;

            font-size: 14px;

        }


        .booking-status {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 8px 14px;

            border-radius: 999px;

            border: 1px solid rgba(0,230,118,0.25);

            color: #00e676;

            background: rgba(0,230,118,0.08);

            font-size: 13px;

            font-weight: 600;

        }


        .booking-status.cancelled {

            color: #ff4d67;

            border-color: rgba(255,77,103,0.25);

            background: rgba(255,77,103,0.08);

        }


        .booking-status.pending {

            color: #ffc107;

            border-color: rgba(255,193,7,0.25);

            background: rgba(255,193,7,0.08);

        }


        .tracking-card {

            background: #111;

            border: 1px solid #292929;

            border-radius: 20px;

            padding: 32px;

            margin-bottom: 25px;

        }


        .tracking-title {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 30px;

        }


        .tracking-title h2 {

            margin: 0;

        }


        .timeline {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 12px;

            position: relative;

        }


        .timeline-step {

            text-align: center;

            position: relative;

            z-index: 1;

        }


        .timeline-icon {

            width: 48px;

            height: 48px;

            margin: 0 auto 12px;

            border-radius: 50%;

            border: 2px solid #333;

            background: #111;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 18px;

            box-sizing: border-box;

        }


        .timeline-step.active .timeline-icon,
        .timeline-step.completed .timeline-icon {

            border-color: #00e676;

            color: #00e676;

            background: rgba(0,230,118,0.08);

        }


        .timeline-step.current .timeline-icon {

            box-shadow:
                0 0 0 6px
                rgba(0,230,118,0.08);

        }


        .timeline-step h4 {

            margin: 0 0 6px;

            font-size: 14px;

        }


        .timeline-step p {

            margin: 0;

            color: #777;

            font-size: 11px;

            line-height: 1.5;

        }


        .info-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;

        }


        .info-card {

            background: #111;

            border: 1px solid #292929;

            border-radius: 20px;

            padding: 28px;

        }


        .info-card h2 {

            margin-top: 0;

            margin-bottom: 22px;

            font-size: 20px;

        }


        .info-row {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

            padding: 13px 0;

            border-bottom: 1px solid #222;

        }


        .info-row:last-child {

            border-bottom: none;

        }


        .info-label {

            color: #777;

            font-size: 13px;

        }


        .info-value {

            color: #f5f5f5;

            font-size: 14px;

            font-weight: 600;

            text-align: right;

            word-break: break-word;

        }


        .price-total {

            font-size: 22px;

            color: #00e676;

        }


        .route-card {

            grid-column: 1 / -1;

        }


        .route {

            display: grid;

            grid-template-columns:
                1fr 80px 1fr;

            align-items: center;

            gap: 15px;

        }


        .location-box {

            background: #161616;

            border: 1px solid #292929;

            border-radius: 14px;

            padding: 20px;

        }


        .location-label {

            display: block;

            color: #777;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            margin-bottom: 8px;

        }


        .location-value {

            font-weight: 600;

            line-height: 1.5;

        }


        .route-arrow {

            width: 54px;

            height: 54px;

            margin: auto;

            border-radius: 50%;

            border: 1px solid #333;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #00e676;

            font-size: 22px;

        }


        .route-tracker {
            margin-top: 28px;
            padding: 24px;
            background: #161616;
            border: 1px solid #292929;
            border-radius: 18px;
        }

        .route-tracker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
        }

        .route-tracker-header h3 {
            margin: 0;
            font-size: 17px;
        }

        .route-tracker-progress {
            color: #00e676;
            font-size: 13px;
            font-weight: 700;
        }

        .route-track {
            position: relative;
            height: 90px;
            margin: 10px 5% 0;
        }

        .route-line {
            position: absolute;
            left: 0;
            right: 0;
            top: 28px;
            height: 4px;
            background: #333;
            border-radius: 10px;
        }

        .route-line-progress {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: #00e676;
            border-radius: 10px;
            transition: width .5s ease;
        }

        .route-marker {
            position: absolute;
            top: 9px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #444;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateX(-50%);
            z-index: 2;
            font-size: 17px;
        }

        .route-marker.pickup {
            left: 0;
            transform: none;
        }

        .route-marker.destination {
            left: 100%;
        }

        .route-marker.active {
            border-color: #00e676;
            background: rgba(0,230,118,.1);
        }

        .route-vehicle {
            position: absolute;
            top: 1px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #111;
            border: 2px solid #00e676;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateX(-50%);
            z-index: 3;
            font-size: 23px;
            transition: left .5s ease;
        }

        .route-location-labels {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 12px;
        }

        .route-location-labels span {
            color: #888;
            font-size: 11px;
            max-width: 42%;
        }

        .route-location-labels span:last-child {
            text-align: right;
        }

        @media (max-width: 520px) {
            .route-tracker {
                padding: 18px;
            }

            .route-track {
                margin-left: 2%;
                margin-right: 2%;
            }

            .route-vehicle {
                width: 46px;
                height: 46px;
            }
        }

        .action-row {

            display: flex;

            gap: 12px;

            flex-wrap: wrap;

            margin-top: 25px;

        }


        .action-row button {

            min-height: 46px;

        }


        .empty-state {

            text-align: center;

            padding: 90px 20px;

        }


        .empty-state-icon {

            font-size: 50px;

            margin-bottom: 15px;

        }


        .error-message {

            color: #ff4d67;

            margin-top: 10px;

        }


        @media (max-width: 800px) {

            .timeline {

                grid-template-columns:
                    repeat(2, 1fr);

                row-gap: 28px;

            }


            .info-grid {

                grid-template-columns: 1fr;

            }


            .route-card {

                grid-column: auto;

            }


            .route {

                grid-template-columns: 1fr;

            }


            .route-arrow {

                transform: rotate(90deg);

            }

        }


        @media (max-width: 520px) {

            .logistics-detail-page {

                padding-left: 15px;

                padding-right: 15px;

            }


            .tracking-card,
            .info-card {

                padding: 20px;

                border-radius: 16px;

            }


            .timeline {

                grid-template-columns: 1fr;

            }


            .timeline-step {

                display: grid;

                grid-template-columns:
                    48px 1fr;

                column-gap: 14px;

                text-align: left;

                align-items: center;

            }


            .timeline-icon {

                grid-row: span 2;

                margin: 0;

            }


            .timeline-step h4 {

                margin-bottom: 3px;

            }

        }

    </style>

</head>


<body>


<header class="navbar">

    <a
        href="../index.html"
        class="logo">

        <span class="logo-icon">
            T
        </span>

        Trade<span class="logo-highlight">
            Hub
        </span>

    </a>


    <nav class="nav-links">

        <a href="../index.html">
            Home
        </a>

        <a href="logistics.html">
            Logistics
        </a>

        <a href="logistics-bookings.html">
            My Bookings
        </a>

    </nav>


    <div class="nav-actions">

        <button
            class="secondary-btn"
            onclick="
                window.location.href =
                'logistics-bookings.html'
            ">

            ← Bookings

        </button>

    </div>

</header>


<main
    id="pageContent"
    class="logistics-detail-page">

</main>


<script src="../js/logistics.js"></script>


<script>

/* =====================================================
   GET BOOKING ID
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const bookingId =
    params.get("id");


const pageContent =
    document.getElementById(
        "pageContent"
    );


/* =====================================================
   CURRENT USER
===================================================== */

const currentUser =
    JSON.parse(
        localStorage.getItem(
            "tradehub_current_user"
        )
    );


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   FORMAT MONEY
===================================================== */

function formatMoney(
    value
) {

    const number =
        Number(value) || 0;


    return "₹" +
        number.toLocaleString(
            "en-IN"
        );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
    value
) {

    if (!value) {

        return "—";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return escapeHtml(
            value
        );

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =====================================================
   FORMAT DATE + TIME
===================================================== */

function formatDateTime(
    value
) {

    if (!value) {

        return "—";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return escapeHtml(
            value
        );

    }


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =====================================================
   GET BOOKING
===================================================== */

function findBooking() {

    if (
        !bookingId
    ) {

        return null;

    }


    if (
        typeof getAllLogisticsBookings ===
        "function"
    ) {

        const bookings =
            getAllLogisticsBookings() ||
            [];


        return bookings.find(
            function(booking) {

                return (
                    String(
                        booking.id
                    ) ===
                    String(
                        bookingId
                    )
                );

            }
        ) || null;

    }


    /*
     * Fallback for installations where the helper
     * has a different name.
     */

    const possibleKeys = [
        "tradehub_logistics_bookings",
        "logistics_bookings",
        "tradehub_logistics_bookings_v1"
    ];


    for (
        const key of possibleKeys
    ) {

        const stored =
            JSON.parse(
                localStorage.getItem(
                    key
                )
            );


        if (
            Array.isArray(
                stored
            )
        ) {

            const found =
                stored.find(
                    function(booking) {

                        return (
                            String(
                                booking.id
                            ) ===
                            String(
                                bookingId
                            )
                        );

                    }
                );


            if (found) {

                return found;

            }

        }

    }


    return null;

}


/* =====================================================
   STATUS HELPERS
===================================================== */

const storageStatusSteps = [

    {
        key: "pending",
        label: "Booking Requested",
        icon: "📝",
        description: "Your booking request has been sent."
    },

    {
        key: "confirmed",
        label: "Confirmed",
        icon: "✓",
        description: "The provider confirmed your booking."
    },

    {
        key: "active",
        label: "Service Active",
        icon: "🔄",
        description: "The logistics service is currently active."
    },

    {
        key: "completed",
        label: "Completed",
        icon: "✓",
        description: "The logistics service has been completed."
    }

];


const transportStatusSteps = [

    {
        key: "pending",
        label: "Booking Requested",
        icon: "📝",
        description: "Your booking request has been sent."
    },

    {
        key: "confirmed",
        label: "Confirmed",
        icon: "✓",
        description: "The provider confirmed your booking."
    },

    {
        key: "vehicle_assigned",
        label: "Vehicle Assigned",
        icon: "🚚",
        description: "A vehicle has been assigned to your booking."
    },

    {
        key: "picked_up",
        label: "Picked Up",
        icon: "📦",
        description: "Your shipment has been picked up."
    },

    {
        key: "in_transit",
        label: "In Transit",
        icon: "🚚",
        description: "Your shipment is on the way."
    },

    {
        key: "arrived",
        label: "Arrived",
        icon: "📍",
        description: "The vehicle has reached the destination."
    },

    {
        key: "completed",
        label: "Completed",
        icon: "✓",
        description: "The logistics service has been completed."
    }

];


function isTransportBooking(
    booking
) {

    if (!booking) {
        return false;
    }


    const transportTypes = [
        "truck",
        "ship",
        "boat",
        "train"
    ];


    return transportTypes.includes(
        String(
            booking.serviceType || ""
        ).toLowerCase()
    );

}


function getStatusSteps(
    booking
) {

    return isTransportBooking(
        booking
    )
        ? transportStatusSteps
        : storageStatusSteps;

}


function getStatusIndex(
    status,
    booking
) {

    const normalized =
        String(
            status ||
            "pending"
        ).toLowerCase();


    const steps =
        getStatusSteps(
            booking
        );


    return steps.findIndex(
        function(step) {

            return (
                step.key ===
                normalized
            );

        }
    );

}


/* =====================================================
   TRANSPORT ROUTE TRACKER
===================================================== */

function getTransportProgress(status) {

    const progressMap = {
        pending: 0,
        confirmed: 0,
        vehicle_assigned: 10,
        picked_up: 25,
        in_transit: 60,
        arrived: 100,
        completed: 100
    };

    const key =
        String(
            status || "pending"
        ).toLowerCase();

    return progressMap[key] ?? 0;
}


function renderTransportRouteTracker(
    booking,
    pickup,
    destination
) {

    if (!isTransportBooking(booking)) {
        return "";
    }

    const progress =
        getTransportProgress(
            booking.status
        );

    const statusKey =
        String(
            booking.status || "pending"
        ).toLowerCase();

    const statusStep =
        transportStatusSteps.find(
            function(step) {
                return step.key === statusKey;
            }
        );

    const statusLabel =
        statusStep?.label ||
        "Booking Requested";

    return `

        <div class="route-tracker">

            <div class="route-tracker-header">

                <h3>
                    🚚 Transport Tracking
                </h3>

                <span class="route-tracker-progress">
                    ${progress}% •
                    ${escapeHtml(statusLabel)}
                </span>

            </div>

            <div class="route-track">

                <div class="route-line">

                    <div
                        class="route-line-progress"
                        style="width:${progress}%;">

                    </div>

                </div>

                <div
                    class="route-marker pickup active">

                    📍

                </div>

                <div
                    class="route-vehicle"
                    style="
                        left:${progress}%;
                    ">

                    🚚

                </div>

                <div
                    class="route-marker destination ${
                        progress >= 100
                            ? "active"
                            : ""
                    }">

                    📍

                </div>

            </div>

            <div class="route-location-labels">

                <span>
                    Pickup<br>
                    <strong>
                        ${escapeHtml(
                            pickup ||
                            "Not specified"
                        )}
                    </strong>
                </span>

                <span>
                    Destination<br>
                    <strong>
                        ${escapeHtml(
                            destination ||
                            "Not specified"
                        )}
                    </strong>
                </span>

            </div>

        </div>

    `;
}


/* =====================================================
   RENDER STATUS
===================================================== */

function renderStatusTimeline(
    booking
) {

    const status =
        String(
            booking.status ||
            "pending"
        ).toLowerCase();


    if (
        status ===
        "cancelled"
    ) {

        return `

            <div
                class="tracking-title">

                <div>

                    <span
                        class="section-label">

                        BOOKING STATUS

                    </span>

                    <h2>
                        Booking Cancelled
                    </h2>

                </div>

                <span
                    class="booking-status cancelled">

                    ● Cancelled

                </span>

            </div>

            <p
                style="color:#888;margin:0;">

                This logistics booking has been cancelled.

            </p>

        `;

    }


    const steps =
        getStatusSteps(
            booking
        );


    const currentIndex =
        getStatusIndex(
            status,
            booking
        );


    return `

        <div
            class="tracking-title">

            <div>

                <span
                    class="section-label">

                    BOOKING TRACKING

                </span>

                <h2>
                    Track Your Booking
                </h2>

            </div>

            <span
                class="booking-status ${
                    status === "pending"
                        ? "pending"
                        : ""
                }">

                ● ${
                    (
                        steps.find(
                            function(step) {
                                return step.key === status;
                            }
                        ) || {}
                    ).label ||
                    (
                        status.charAt(0).toUpperCase() +
                        status.slice(1)
                    )
                }

            </span>

        </div>


        <div
            class="timeline">

            ${
                steps.map(
                    function(step, index) {

                        let className =
                            "timeline-step";


                        if (
                            index <
                            currentIndex
                        ) {

                            className +=
                                " completed";

                        }


                        if (
                            index ===
                            currentIndex
                        ) {

                            className +=
                                " current active";

                        }


                        return `

                            <div
                                class="${className}">

                                <div
                                    class="timeline-icon">

                                    ${
                                        index <=
                                        currentIndex
                                            ? "✓"
                                            : step.icon
                                    }

                                </div>

                                <h4>
                                    ${step.label}
                                </h4>

                                <p>
                                    ${step.description}
                                </p>

                            </div>

                        `;

                    }
                ).join("")
            }

        </div>

        ${
            isTransportBooking(booking)
                ? `

                    <p
                        style="
                            margin:24px 0 0;
                            color:#777;
                            font-size:12px;
                            text-align:center;
                        ">

                        🚚 Transport tracking updates appear here
                        as the provider moves your booking through
                        each stage.

                    </p>

                `
                : ""
        }

    `;

}


/* =====================================================
   RENDER PAGE
===================================================== */

function renderBookingDetails() {

    if (!currentUser) {

        pageContent.innerHTML = `

            <div
                class="empty-state">

                <div
                    class="empty-state-icon">

                    🔐

                </div>

                <h2>
                    Login Required
                </h2>

                <p>
                    Please login to view this booking.
                </p>

                <button
                    class="primary-btn"
                    onclick="
                        window.location.href =
                        'login.html'
                    ">

                    Login

                </button>

            </div>

        `;

        return;

    }


    const booking =
        findBooking();


    if (!booking) {

        pageContent.innerHTML = `

            <div
                class="empty-state">

                <div
                    class="empty-state-icon">

                    📦

                </div>

                <h2>
                    Booking Not Found
                </h2>

                <p>
                    We couldn't find this logistics booking.
                </p>

                <button
                    class="secondary-btn"
                    onclick="
                        window.location.href =
                        'logistics-bookings.html'
                    ">

                    ← Back to Bookings

                </button>

            </div>

        `;

        return;

    }


    /*
     * Security:
     * Only the renter or provider should be able
     * to view a booking.
     */

    const isRenter =
        String(
            booking.renterId
        ) ===
        String(
            currentUser.id
        );


    const isProvider =
        String(
            booking.providerId
        ) ===
        String(
            currentUser.id
        );


    if (
        !isRenter &&
        !isProvider
    ) {

        pageContent.innerHTML = `

            <div
                class="empty-state">

                <div
                    class="empty-state-icon">

                    🔒

                </div>

                <h2>
                    Access Denied
                </h2>

                <p>
                    You are not a participant in this booking.
                </p>

                <button
                    class="secondary-btn"
                    onclick="
                        window.location.href =
                        'logistics-bookings.html'
                    ">

                    ← Back to Bookings

                </button>

            </div>

        `;

        return;

    }


    const serviceName =
        booking.serviceName ||
        booking.listingName ||
        booking.title ||
        "Logistics Service";


    const providerName =
        booking.providerName ||
        "Provider";


    const renterName =
        booking.renterName ||
        "Renter";


    const pricingType =
        booking.pricingType ||
        booking.priceType ||
        "—";


    const pricingUnitMap = {
        per_km: "km",
        per_day: "day",
        per_hour: "hour",
        flat: "booking",
        per_unit: "unit"
    };


    const pricingUnit =
        pricingUnitMap[
            String(
                pricingType
            ).toLowerCase()
        ] ||
        "unit";


    const distance =
        Number(
            booking.distanceKm ??
            booking.distance
        ) || 0;


    const durationDays =
        Number(
            booking.durationDays ??
            booking.rentalDays ??
            booking.days
        ) || 0;


    const durationHours =
        Number(
            booking.durationHours ??
            booking.hours
        ) || 0;


    const rawQuantity =
        Number(
            booking.quantity
        ) || 0;


    let quantity =
        rawQuantity;


    if (
        pricingType === "per_km" &&
        distance > 0
    ) {

        quantity =
            distance;

    }
    else if (
        pricingType === "per_day" &&
        durationDays > 0
    ) {

        quantity =
            durationDays;

    }
    else if (
        pricingType === "per_hour" &&
        durationHours > 0
    ) {

        quantity =
            durationHours;

    }
    else if (
        quantity <= 0
    ) {

        quantity =
            1;

    }


    const unitPrice =
        Number(
            booking.pricePerUnit ??
            booking.unitPrice ??
            booking.price ??
            booking.listingPrice
        ) || 0;


    const baseCost =
        Number(
            booking.baseCost ??
            booking.subtotal ??
            booking.total
        ) || 0;


    const deposit =
        Number(
            booking.securityDeposit ??
            booking.deposit
        ) || 0;


    const total =
        Number(
            booking.totalCost ??
            booking.total ??
            baseCost + deposit
        ) || 0;


    const pickup =
        booking.pickupLocation ||
        booking.pickupAddress ||
        booking.from ||
        "";


    const destination =
        booking.destination ||
        booking.deliveryLocation ||
        booking.deliveryAddress ||
        booking.to ||
        "";


    const startDate =
        booking.startDate ||
        booking.rentalStart ||
        booking.fromDate ||
        booking.bookingDate;


    let endDate =
        booking.endDate ||
        booking.rentalEnd ||
        booking.toDate;


    if (
        !endDate &&
        startDate &&
        pricingType === "per_day" &&
        durationDays > 0
    ) {

        const calculatedEnd =
            new Date(
                startDate
            );

        calculatedEnd.setDate(
            calculatedEnd.getDate() +
            durationDays -
            1
        );

        if (
            !Number.isNaN(
                calculatedEnd.getTime()
            )
        ) {

            endDate =
                calculatedEnd
                .toISOString()
                .split("T")[0];

        }

    }


    const createdAt =
        booking.createdAt ||
        booking.bookedAt;


    const notes =
        booking.notes ||
        booking.specialInstructions ||
        "";


    const canCancel =
        isRenter &&
        booking.status !== "completed" &&
        booking.status !== "cancelled";


    pageContent.innerHTML = `

        <section
            class="booking-header">

            <span
                class="section-label">

                LOGISTICS BOOKING

            </span>


            <h1>

                Track Your
                <span>
                    Booking
                </span>

            </h1>


            <p
                class="booking-id">

                Booking ID:
                <strong>
                    ${escapeHtml(
                        booking.id
                    )}
                </strong>

            </p>

        </section>


        <section
            class="tracking-card">

            ${renderStatusTimeline(
                booking
            )}

            ${
                booking.updatedAt
                    ? `

                        <p
                            style="
                                margin:22px 0 0;
                                color:#666;
                                font-size:12px;
                                text-align:center;
                            ">

                            Last updated:
                            ${formatDateTime(
                                booking.updatedAt
                            )}

                        </p>

                    `
                    : ""
            }

        </section>


        <div
            class="info-grid">


            <!-- SERVICE -->

            <section
                class="info-card">

                <h2>
                    🚚 Service Details
                </h2>


                <div
                    class="info-row">

                    <span
                        class="info-label">

                        Service

                    </span>

                    <span
                        class="info-value">

                        ${escapeHtml(
                            serviceName
                        )}

                    </span>

                </div>


                <div
                    class="info-row">

                    <span
                        class="info-label">

                        Provider

                    </span>

                    <span
                        class="info-value">

                        ${escapeHtml(
                            providerName
                        )}

                    </span>

                </div>


                <div
                    class="info-row">

                    <span
                        class="info-label">

                        Renter

                    </span>

                    <span
                        class="info-value">

                        ${escapeHtml(
                            renterName
                        )}

                    </span>

                </div>


                <div
                    class="info-row">

                    <span
                        class="info-label">

                        Booking Created

                    </span>

                    <span
                        class="info-value">

                        ${formatDateTime(
                            createdAt
                        )}

                    </span>

                </div>

            </section>


            <!-- COST -->

            <section
                class="info-card">

                <h2>
                    💰 Cost Details
                </h2>


                <div
                    class="info-row">

                    <span
                        class="info-label">

                        Pricing Model

                    </span>

                    <span
                        class="info-value">

                        ${escapeHtml(
                            pricingType
                        )}

                    </span>

                </div>


                <div
                    class="info-row">

                    <span
                        class="info-label">

                        ${
                            pricingType === "per_km"
                                ? "Distance"
                                : pricingType === "per_day"
                                    ? "Rental Days"
                                    : pricingType === "per_hour"
                                        ? "Rental Hours"
                                        : "Quantity"
                        }

                    </span>

                    <span
                        class="info-value">

                        ${
                            pricingType === "per_km"
                                ? `${quantity} km`
                                : pricingType === "per_day"
                                    ? `${quantity} day(s)`
                                    : pricingType === "per_hour"
                                        ? `${quantity} hour(s)`
                                        : quantity
                        }

                    </span>

                </div>


                <div
                    class="info-row">

                    <span
                        class="info-label">

                        ${
                            pricingType === "per_km"
                                ? "Price / km"
                                : pricingType === "per_day"
                                    ? "Price / day"
                                    : pricingType === "per_hour"
                                        ? "Price / hour"
                                        : "Price / Unit"
                        }

                    </span>

                    <span
                        class="info-value">

                        ${formatMoney(
                            unitPrice
                        )}

                    </span>

                </div>


                <div
                    class="info-row">

                    <span
                        class="info-label">

                        Base Cost

                    </span>

                    <span
                        class="info-value">

                        ${formatMoney(
                            baseCost
                        )}

                    </span>

                </div>


                ${
                    deposit > 0
                        ? `

                            <div
                                class="info-row">

                                <span
                                    class="info-label">

                                    Security Deposit

                                </span>

                                <span
                                    class="info-value">

                                    ${formatMoney(
                                        deposit
                                    )}

                                </span>

                            </div>

                        `
                        : ""
                }


                <div
                    class="info-row">

                    <span
                        class="info-label">

                        Total

                    </span>

                    <span
                        class="info-value price-total">

                        ${formatMoney(
                            total
                        )}

                    </span>

                </div>

            </section>


            <!-- ROUTE -->

            ${
                pickup || destination
                    ? `

                        <section
                            class="info-card route-card">

                            <h2>
                                📍 Route
                            </h2>


                            <div
                                class="route">


                                <div
                                    class="location-box">

                                    <span
                                        class="location-label">

                                        Pickup

                                    </span>

                                    <div
                                        class="location-value">

                                        ${
                                            escapeHtml(
                                                pickup ||
                                                "Not specified"
                                            )
                                        }

                                    </div>

                                </div>


                                <div
                                    class="route-arrow">

                                    →

                                </div>


                                <div
                                    class="location-box">

                                    <span
                                        class="location-label">

                                        Destination

                                    </span>

                                    <div
                                        class="location-value">

                                        ${
                                            escapeHtml(
                                                destination ||
                                                "Not specified"
                                            )
                                        }

                                    </div>

                                </div>

                            </div>


                            <div
                                style="
                                    display:flex;
                                    gap:30px;
                                    flex-wrap:wrap;
                                    margin-top:20px;
                                ">


                                ${
                                    distance > 0
                                        ? `

                                            <div>

                                                <span
                                                    class="info-label">

                                                    Distance

                                                </span>

                                                <strong
                                                    style="display:block;margin-top:5px;">

                                                    ${escapeHtml(
                                                        distance
                                                    )} km

                                                </strong>

                                            </div>

                                        `
                                        : ""
                                }


                                ${
                                    pricingType === "per_hour" &&
                                    durationHours > 0
                                        ? `

                                            <div>

                                                <span
                                                    class="info-label">

                                                    Duration

                                                </span>

                                                <strong
                                                    style="display:block;margin-top:5px;">

                                                    ${escapeHtml(
                                                        durationHours
                                                    )} hour(s)

                                                </strong>

                                            </div>

                                        `
                                        : pricingType === "per_day" &&
                                          durationDays > 0
                                            ? `

                                                <div>

                                                    <span
                                                        class="info-label">

                                                        Duration

                                                    </span>

                                                    <strong
                                                        style="display:block;margin-top:5px;">

                                                        ${escapeHtml(
                                                            durationDays
                                                        )} day(s)

                                                    </strong>

                                                </div>

                                            `
                                            : ""
                                }

                            </div>

                            ${renderTransportRouteTracker(
                                booking,
                                pickup,
                                destination
                            )}

                        </section>

                    `
                    : ""
            }


            <!-- DATES -->

            <section
                class="info-card">

                <h2>
                    📅 Booking Schedule
                </h2>


                <div
                    class="info-row">

                    <span
                        class="info-label">

                        ${
                            pricingType === "per_km"
                                ? "Booking Date"
                                : "Start"
                        }

                    </span>

                    <span
                        class="info-value">

                        ${formatDate(
                            startDate
                        )}

                    </span>

                </div>


                ${
                    pricingType !== "per_km" || endDate
                        ? `

                            <div
                                class="info-row">

                                <span
                                    class="info-label">

                                    End

                                </span>

                                <span
                                    class="info-value">

                                    ${formatDate(
                                        endDate
                                    )}

                                </span>

                            </div>

                        `
                        : ""
                }

            </section>


            <!-- NOTES -->

            <section
                class="info-card">

                <h2>
                    📝 Notes
                </h2>


                <p
                    style="
                        color:#aaa;
                        line-height:1.7;
                        margin:0;
                    ">

                    ${
                        notes
                            ? escapeHtml(
                                notes
                            )
                            : "No special instructions were added to this booking."
                    }

                </p>

            </section>


        </div>


        <!-- ACTIONS -->

        <section
            class="info-card"
            style="margin-top:25px;">

            <h2>
                Actions
            </h2>


            <div
                class="action-row">


                <button
                    class="secondary-btn"
                    type="button"
                    onclick="
                        window.location.href =
                        'logistics-bookings.html'
                    ">

                    ← Back to Bookings

                </button>


                <button
                    class="secondary-btn"
                    type="button"
                    onclick="
                        window.location.href =
                        'logistics-details.html?id=${encodeURIComponent(
                            booking.listingId
                        )}'
                    ">

                    View Service

                </button>


                ${
                    isRenter
                        ? `

                            <button
                                class="secondary-btn"
                                type="button"
                                onclick="
                                    contactUser(
                                        '${escapeHtml(
                                            booking.providerId
                                        )}'
                                    )
                                ">

                                💬 Contact Provider

                            </button>

                        `
                        : `

                            <button
                                class="secondary-btn"
                                type="button"
                                onclick="
                                    contactUser(
                                        '${escapeHtml(
                                            booking.renterId
                                        )}'
                                    )
                                ">

                                💬 Contact Renter

                            </button>

                        `
                }


                ${
                    canCancel
                        ? `

                            <button
                                class="secondary-btn"
                                type="button"
                                onclick="
                                    cancelCurrentBooking()
                                "
                                style="
                                    border-color:
                                        rgba(255,77,103,0.4);
                                    color:#ff4d67;
                                ">

                                Cancel Booking

                            </button>

                        `
                        : ""
                }


            </div>

        </section>

    `;

}


/* =====================================================
   CONTACT USER
===================================================== */

function contactUser(
    userId
) {

    if (!userId) {

        alert(
            "The user could not be identified."
        );

        return;

    }


    if (
        String(userId) ===
        String(currentUser.id)
    ) {

        alert(
            "You cannot contact yourself."
        );

        return;

    }


    window.location.href =
        "messages.html?user=" +
        encodeURIComponent(
            userId
        );

}


/* =====================================================
   CANCEL CURRENT BOOKING
===================================================== */

function cancelCurrentBooking() {

    const booking =
        findBooking();


    if (!booking) {

        alert(
            "Booking not found."
        );

        return;

    }


    if (
        booking.status ===
        "completed" ||
        booking.status ===
        "cancelled"
    ) {

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to cancel this booking?"
        );


    if (!confirmed) {

        return;

    }


    if (
        typeof cancelLogisticsBooking ===
        "function"
    ) {

        cancelLogisticsBooking(
            booking.id
        );

        renderBookingDetails();

        return;

    }


    alert(
        "Booking cancellation is not available."
    );

}


/* =====================================================
   INITIALIZE
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        renderBookingDetails();

    }
);


</script>


</body>

</html>
