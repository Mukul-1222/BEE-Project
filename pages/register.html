<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | TradeHub</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="../css/auth.css">

</head>

<body>

<section class="auth-page">

    <div class="auth-container">

        <div class="auth-logo">

            <div class="auth-logo-icon">
                T
            </div>

            Trade<span>Hub</span>

        </div>


        <h1>
            Create account
        </h1>

        <p class="auth-subtitle">
            Join the TradeHub marketplace
        </p>


        <div class="auth-error"
             id="registerError">
        </div>


        <form id="registerForm">


            <!-- USER TYPE -->

            <div class="form-group">

                <label>
                    Register as
                </label>

            </div>


            <div class="user-type">

                <input
                    type="radio"
                    name="userType"
                    id="customer"
                    value="customer"
                    checked
                >

                <label for="customer">

                    <span class="user-type-icon">
                        👤
                    </span>

                    Customer

                </label>


                <input
                    type="radio"
                    name="userType"
                    id="business"
                    value="business"
                >

                <label for="business">

                    <span class="user-type-icon">
                        🏢
                    </span>

                    Business

                </label>

            </div>


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Your name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="registerConfirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-btn">

                Create Account

            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <button
            class="google-btn"
            id="googleRegister">

            🔵 Register with Google

        </button>


        <p class="auth-switch">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a href="../index.html"
           class="back-home">

            ← Back to TradeHub

        </a>

    </div>

</section>


<script src="../js/auth.js"></script>

</body>

</html>
