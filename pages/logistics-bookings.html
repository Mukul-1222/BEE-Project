<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Logistics Bookings | TradeHub</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <style>

        .bookings-page {
            max-width: 1150px;
            margin: 0 auto;
            padding: 65px 24px 100px;
        }

        .bookings-header {
            margin-bottom: 30px;
        }

        .bookings-header h1 {
            margin: 8px 0 12px;
            font-size: clamp(36px, 5vw, 56px);
        }

        .bookings-header h1 span {
            color: var(--accent);
        }

        .bookings-header p {
            color: #999;
            max-width: 700px;
            line-height: 1.7;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            border-bottom: 1px solid #292929;
            padding-bottom: 10px;
        }

        .tab-btn {
            border: 1px solid #292929;
            background: #111;
            color: #888;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .tab-btn.active {
            color: #00e676;
            border-color: rgba(0,230,118,.35);
            background: rgba(0,230,118,.05);
        }

        .booking-list {
            display: grid;
            gap: 16px;
        }

        .booking-card {
            background: #111;
            border: 1px solid #292929;
            border-radius: 14px;
            padding: 21px;
        }

        .booking-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-start;
        }

        .booking-title {
            margin: 0 0 7px;
            font-size: 19px;
        }

        .booking-id {
            color: #666;
            font-size: 10px;
        }

        .status {
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .07em;
            white-space: nowrap;
        }

        .status-pending {
            color: #ffd36b;
            border: 1px solid rgba(255,211,107,.25);
            background: rgba(255,211,107,.05);
        }

        .status-confirmed,
        .status-active,
        .status-vehicle_assigned,
        .status-picked_up,
        .status-in_transit,
        .status-arrived {
            color: #00e676;
            border: 1px solid rgba(0,230,118,.25);
            background: rgba(0,230,118,.05);
        }

        .status-completed {
            color: #78a9ff;
            border: 1px solid rgba(120,169,255,.25);
            background: rgba(120,169,255,.05);
        }

        .status-cancelled {
            color: #ff8585;
            border: 1px solid rgba(255,70,70,.25);
            background: rgba(255,70,70,.05);
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 18px 0;
        }

        .detail {
            background: #0b0b0b;
            border: 1px solid #242424;
            border-radius: 9px;
            padding: 11px;
        }

        .detail span {
            display: block;
            color: #666;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .07em;
            margin-bottom: 5px;
        }

        .detail strong {
            color: #ddd;
            font-size: 13px;
            word-break: break-word;
        }

        .booking-notes {
            color: #888;
            font-size: 12px;
            line-height: 1.6;
            padding: 12px 0;
            border-top: 1px solid #242424;
        }

        .booking-actions {
            display: flex;
            justify-content: flex-end;
            gap: 9px;
            flex-wrap: wrap;
            padding-top: 14px;
            border-top: 1px solid #242424;
        }

        .empty {
            padding: 70px 20px;
            text-align: center;
            border: 1px dashed #292929;
            border-radius: 14px;
            color: #777;
        }

        @media (max-width: 850px) {

            .booking-details {
                grid-template-columns: 1fr 1fr;
            }

        }

        @media (max-width: 560px) {

            .bookings-page {
                padding: 40px 16px 70px;
            }

            .tabs {
                overflow-x: auto;
            }

            .booking-top {
                flex-direction: column;
            }

            .booking-details {
                grid-template-columns: 1fr;
            }

            .booking-actions button {
                flex: 1 1 100%;
            }

        }

    </style>

</head>


<body>


<header class="navbar">

    <a
        href="../index.html"
        class="logo">

        <span class="logo-icon">
            T
        </span>

        Trade<span class="logo-highlight">
            Hub
        </span>

    </a>


    <nav class="nav-links">

        <a href="../index.html">
            Home
        </a>

        <a href="logistics.html">
            Logistics
        </a>

        <a href="products.html">
            Marketplace
        </a>

        <a href="messages.html">
            Messages
        </a>

    </nav>


    <div class="nav-actions">

        <button
            class="secondary-btn"
            onclick="window.location.href='logistics.html'">

            ← Logistics

        </button>

        <button
            class="secondary-btn"
            onclick="window.location.href='list-logistics.html'">

            + List Service

        </button>

    </div>

</header>



<main class="bookings-page">


    <section class="bookings-header">

        <span class="section-label">
            LOGISTICS MANAGEMENT
        </span>

        <h1>
            Logistics <span>Bookings</span>
        </h1>

        <p>
            Manage logistics services you have booked
            and booking requests received for services
            you listed.
        </p>

    </section>



    <div class="tabs">

        <button
            id="myBookingsTab"
            class="tab-btn active"
            type="button">

            My Bookings

        </button>


        <button
            id="receivedBookingsTab"
            class="tab-btn"
            type="button">

            Received Requests

        </button>

    </div>



    <div
        style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
        <span id="bookingCount" style="color:#666;font-size:12px;"></span>
        <button class="secondary-btn" type="button" onclick="renderBookings()">↻ Refresh</button>
    </div>

    <div
        id="bookingList"
        class="booking-list">

    </div>


</main>



<script src="../js/logistics.js"></script>


<script>

    const currentUser =
        getLogisticsCurrentUser();


    if (!currentUser) {

        window.location.href =
            "login.html";

    }


    const bookingList =
        document.getElementById(
            "bookingList"
        );


    const myTab =
        document.getElementById(
            "myBookingsTab"
        );


    const receivedTab =
        document.getElementById(
            "receivedBookingsTab"
        );


    let activeView =
        "my";


    myTab.addEventListener(
        "click",
        function() {

            activeView =
                "my";

            updateTabs();

            renderBookings();

        }
    );


    receivedTab.addEventListener(
        "click",
        function() {

            activeView =
                "received";

            updateTabs();

            renderBookings();

        }
    );


    function updateTabs() {

        myTab.classList.toggle(
            "active",
            activeView === "my"
        );


        receivedTab.classList.toggle(
            "active",
            activeView === "received"
        );

    }


    function getStatusClass(
        status
    ) {

        return (
            "status-" +
            String(
                status || "pending"
            )
            .toLowerCase()
        );

    }


    function formatStatus(
        status
    ) {

        const labels = {

            pending:
                "Pending",

            confirmed:
                "Confirmed",

            vehicle_assigned:
                "Vehicle Assigned",

            picked_up:
                "Picked Up",

            in_transit:
                "In Transit",

            arrived:
                "Arrived",

            active:
                "Active",

            completed:
                "Completed",

            cancelled:
                "Cancelled"

        };


        return (
            labels[
                String(
                    status || ""
                ).toLowerCase()
            ] ||
            status ||
            "Pending"
        );

    }


    function formatDate(
        value
    ) {

        if (!value) {
            return "—";
        }


        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return value;

        }


        return date.toLocaleDateString(
            "en-IN",
            {
                day: "numeric",
                month: "short",
                year: "numeric"
            }
        );

    }


    function escapeHTML(
        value
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            value == null
                ? ""
                : String(value);


        return div.innerHTML;

    }


    function renderBookings() {

        const bookings =
            activeView === "my"
                ? getMyLogisticsBookings()
                : getReceivedLogisticsBookings();


        bookingList.innerHTML =
            "";

        const bookingCount = document.getElementById("bookingCount");

        if (bookingCount) {
            bookingCount.textContent = bookings.length === 1 ? "1 booking" : `${bookings.length} bookings`;
        }



        if (
            bookings.length === 0
        ) {

            bookingList.innerHTML = `

                <div class="empty">

                    <div style="font-size:50px;">
                        ${
                            activeView === "my"
                                ? "🚚"
                                : "📋"
                        }
                    </div>

                    <h2>
                        ${
                            activeView === "my"
                                ? "No logistics bookings yet"
                                : "No booking requests yet"
                        }
                    </h2>

                    <p>
                        ${
                            activeView === "my"
                                ? "Browse the logistics marketplace and book a service."
                                : "When someone books one of your logistics services, the request will appear here."
                        }
                    </p>

                    <br>

                    <button
                        class="primary-btn"
                        onclick="
                            window.location.href='logistics.html'
                        ">

                        Browse Logistics →

                    </button>

                </div>

            `;

            return;

        }


        bookings.forEach(
            function(booking) {

                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "booking-card";


                const personLabel =
                    activeView === "my"
                        ? "Provider"
                        : "Renter";


                const personName =
                    activeView === "my"
                        ? booking.providerName
                        : booking.renterName;


                const quantity =
                    booking.distance != null
                        ? `${booking.distance} km`
                        : booking.days != null
                            ? `${booking.days} days`
                            : booking.hours != null
                                ? `${booking.hours} hours`
                                : booking.quantity != null
                                    ? `${booking.quantity} unit(s)`
                                    : "—";


                card.innerHTML = `

                    <div class="booking-top">

                        <div>

                            <h3 class="booking-title">

                                ${escapeHTML(
                                    booking.serviceTitle ||
                                    "Logistics Service"
                                )}

                            </h3>

                            <div class="booking-id">

                                Booking ID:
                                ${escapeHTML(
                                    booking.id
                                )}

                            </div>

                        </div>


                        <span
                            class="status ${getStatusClass(
                                booking.status
                            )}">

                            ${escapeHTML(
                                formatStatus(
                                    booking.status
                                )
                            )}

                        </span>

                    </div>


                    <div class="booking-details">

                        <div class="detail">

                            <span>
                                ${personLabel}
                            </span>

                            <strong>
                                ${escapeHTML(
                                    personName ||
                                    "TradeHub User"
                                )}
                            </strong>

                        </div>


                        <div class="detail">

                            <span>
                                Rental
                            </span>

                            <strong>
                                ${escapeHTML(
                                    quantity
                                )}
                            </strong>

                        </div>


                        <div class="detail">

                            <span>
                                Base Cost
                            </span>

                            <strong>
                                ${formatLogisticsCurrency(
                                    booking.baseCost ||
                                    booking.estimatedCost ||
                                    0
                                )}
                            </strong>

                        </div>


                        <div class="detail">

                            <span>
                                Total
                            </span>

                            <strong>
                                ${formatLogisticsCurrency(
                                    booking.totalCost ||
                                    booking.estimatedCost ||
                                    0
                                )}
                            </strong>

                        </div>

                    </div>


                    <div class="booking-details">

                        <div class="detail">

                            <span>
                                Booking Date
                            </span>

                            <strong>
                                ${escapeHTML(
                                    formatDate(
                                        booking.bookingDate
                                    )
                                )}
                            </strong>

                        </div>


                        <div class="detail">

                            <span>
                                Requested
                            </span>

                            <strong>
                                ${escapeHTML(
                                    formatDate(
                                        booking.createdAt
                                    )
                                )}
                            </strong>

                        </div>


                        <div class="detail">

                            <span>
                                Pickup
                            </span>

                            <strong>
                                ${escapeHTML(
                                    booking.pickupLocation ||
                                    "—"
                                )}
                            </strong>

                        </div>


                        <div class="detail">

                            <span>
                                Destination
                            </span>

                            <strong>
                                ${escapeHTML(
                                    booking.deliveryLocation ||
                                    "—"
                                )}
                            </strong>

                        </div>

                    </div>


                    ${
                        booking.notes
                            ? `
                                <div class="booking-notes">

                                    <strong>
                                        Notes:
                                    </strong>

                                    ${escapeHTML(
                                        booking.notes
                                    )}

                                </div>
                              `
                            : ""
                    }


                    <div class="booking-actions">

                        ${
                            activeView === "my"
                                ? renderRenterActions(
                                    booking
                                )
                                : renderProviderActions(
                                    booking
                                )
                        }

                    </div>

                `;


                bookingList.appendChild(
                    card
                );

            }
        );

    }


    function renderRenterActions(
        booking
    ) {

        let html = `

            <button
                class="primary-btn"
                type="button"
                onclick="
                    window.location.href=
                    'logistics-booking-details.html?id=${encodeURIComponent(
                        booking.id
                    )}'
                ">

                📍 Track Booking →

            </button>


            <button
                class="secondary-btn"
                type="button"
                onclick="
                    window.location.href=
                    'logistics-details.html?id=${encodeURIComponent(
                        booking.listingId
                    )}'
                ">

                View Service

            </button>

        `;


        if (
            booking.status !==
                "completed" &&
            booking.status !==
                "cancelled"
        ) {

            html += `

                <button
                    class="secondary-btn"
                    type="button"
                    onclick="
                        cancelBooking(
                            '${escapeAttribute(
                                booking.id
                            )}'
                        )
                    ">

                    Cancel Booking

                </button>

            `;

        }


        return html;

    }


    function renderProviderActions(
        booking
    ) {

        const transportStatuses = [
            "vehicle_assigned",
            "picked_up",
            "in_transit",
            "arrived"
        ];


        /*
         * A listing is treated as transport when its serviceType
         * is a known transport type. This matches logistics.js.
         */

        const transportTypes = [
            "truck",
            "ship",
            "boat",
            "train"
        ];


        const isTransport =
            transportTypes.includes(
                String(
                    booking.serviceType || ""
                ).toLowerCase()
            );


        let html = `

            <button
                class="primary-btn"
                type="button"
                onclick="
                    window.location.href=
                    'logistics-booking-details.html?id=${encodeURIComponent(
                        booking.id
                    )}'
                ">

                📍 View / Track Booking

            </button>

        `;


        if (
            booking.status ===
            "pending"
        ) {

            html += `

                <button
                    class="primary-btn"
                    type="button"
                    onclick="
                        changeBookingStatus(
                            '${escapeAttribute(
                                booking.id
                            )}',
                            'confirmed'
                        )
                    ">

                    ✓ Confirm

                </button>


                <button
                    class="secondary-btn"
                    type="button"
                    onclick="
                        changeBookingStatus(
                            '${escapeAttribute(
                                booking.id
                            )}',
                            'cancelled'
                        )
                    ">

                    Reject

                </button>

            `;

        }


        if (
            isTransport &&
            booking.status ===
            "confirmed"
        ) {

            html += `

                <button
                    class="primary-btn"
                    type="button"
                    onclick="
                        changeBookingStatus(
                            '${escapeAttribute(
                                booking.id
                            )}',
                            'vehicle_assigned'
                        )
                    ">

                    🚚 Assign Vehicle

                </button>

            `;

        }
        else if (
            !isTransport &&
            booking.status ===
            "confirmed"
        ) {

            html += `

                <button
                    class="primary-btn"
                    type="button"
                    onclick="
                        changeBookingStatus(
                            '${escapeAttribute(
                                booking.id
                            )}',
                            'active'
                        )
                    ">

                    ▶ Start Service

                </button>

            `;

        }


        if (
            isTransport &&
            booking.status ===
            "vehicle_assigned"
        ) {

            html += `

                <button
                    class="primary-btn"
                    type="button"
                    onclick="
                        changeBookingStatus(
                            '${escapeAttribute(
                                booking.id
                            )}',
                            'picked_up'
                        )
                    ">

                    📦 Picked Up

                </button>

            `;

        }


        if (
            isTransport &&
            booking.status ===
            "picked_up"
        ) {

            html += `

                <button
                    class="primary-btn"
                    type="button"
                    onclick="
                        changeBookingStatus(
                            '${escapeAttribute(
                                booking.id
                            )}',
                            'in_transit'
                        )
                    ">

                    🚚 In Transit

                </button>

            `;

        }


        if (
            isTransport &&
            booking.status ===
            "in_transit"
        ) {

            html += `

                <button
                    class="primary-btn"
                    type="button"
                    onclick="
                        changeBookingStatus(
                            '${escapeAttribute(
                                booking.id
                            )}',
                            'arrived'
                        )
                    ">

                    📍 Arrived

                </button>

            `;

        }


        if (
            isTransport &&
            booking.status ===
            "arrived"
        ) {

            html += `

                <button
                    class="primary-btn"
                    type="button"
                    onclick="
                        changeBookingStatus(
                            '${escapeAttribute(
                                booking.id
                            )}',
                            'completed'
                        )
                    ">

                    ✓ Mark Completed

                </button>

            `;

        }


        if (
            !isTransport &&
            booking.status ===
            "active"
        ) {

            html += `

                <button
                    class="primary-btn"
                    type="button"
                    onclick="
                        changeBookingStatus(
                            '${escapeAttribute(
                                booking.id
                            )}',
                            'completed'
                        )
                    ">

                    ✓ Mark Completed

                </button>

            `;

        }


        if (
            booking.status !==
                "cancelled" &&
            booking.status !==
                "completed"
        ) {

            html += `

                <button
                    class="secondary-btn"
                    type="button"
                    onclick="
                        contactUser(
                            '${escapeAttribute(
                                booking.renterId
                            )}'
                        )
                    ">

                    💬 Contact Renter

                </button>

            `;

        }


        return html;

    }


    function changeBookingStatus(
        bookingId,
        status
    ) {

        const result =
            updateLogisticsBookingStatus(
                bookingId,
                status
            );


        if (result) {

            renderBookings();

        }

    }


    function cancelBooking(
        bookingId
    ) {

        if (
            !confirm(
                "Cancel this logistics booking?"
            )
        ) {

            return;

        }


        const result =
            cancelLogisticsBooking(
                bookingId
            );


        if (result) {

            renderBookings();

        }

    }


    function escapeAttribute(
        value
    ) {

        return String(
            value || ""
        )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

    }



    function contactUser(userId) {

        if (!userId) {
            alert("The user could not be identified.");
            return;
        }

        window.location.href = "messages.html?user=" + encodeURIComponent(userId);

    }

    window.addEventListener(
        "tradehubLogisticsUpdated",
        renderBookings
    );


    renderBookings();

</script>


</body>

</html>
